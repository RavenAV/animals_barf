server:
  port: 8080
spring:
  main:
    web-application-type: reactive
#    allow-bean-definition-overriding: true
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "*"
                allowedMethods:
                  - "*"
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "*"
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          routes:
            - id: auth
              uri: lb://auth
              predicates:
                - Path=/api/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
            - id: ui # todo ui with lb
              uri: http://localhost:4200
              predicates:
                - Path=/index.html,/*.js,/*.css
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    gateway:
      enabled: true
jwt:
  secret: # todo в проде вынести в переменные окружения
    access:
      private: "file:D:/DevelopJava/animals_barf/common-jwt-utils/access_private.key"
      public: "file:D:/DevelopJava/animals_barf/common-jwt-utils/access_public.key"
    refresh:
      private: "file:D:/DevelopJava/animals_barf/common-jwt-utils/refresh_private.key"
      public: "file:D:/DevelopJava/animals_barf/common-jwt-utils/refresh_public.key"
  expiration:
    access: 120000
    refresh: 120000
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true